<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR체험버스 - 시간대 선택</title>
<link rel="icon" href="https://hyunra94.github.io/assets/favicon.png">
<meta property="og:image" content="https://hyunra94.github.io/assets/og-default.png">
<meta property="og:url" content="https://hyunra94.github.io/[레포명]/">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.7/signature_pad.umd.min.js"></script>
<style>
  :root {
    --bg-1: #FFF0F5; --bg-2: #FFE4E1;
    --accent: #F7B8C4; --accent-dark: #E88FA2;
    --lavender: #E6E0F8; --text: #5A4A50; --white: #FFFFFF;
    --shadow: rgba(232, 143, 162, 0.25);
    --full: #F0A0A8; --ok: #6FA875;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%; margin: 0; font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  input, textarea {
    -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text;
  }
  .screen { display: flex; flex-direction: column; align-items: center; padding: 28px 20px 60px; }

  .clock { font-size: clamp(28px, 5vw, 44px); font-weight: 700; color: var(--accent-dark); margin-bottom: 4px; }
  .headline { font-size: clamp(15px, 2vw, 19px); font-weight: 700; margin-bottom: 22px; text-align: center; }

  .slots-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px; width: 100%; max-width: 1200px;
  }
  .slot-btn {
    border: none; border-radius: 20px; background: var(--white); box-shadow: 0 8px 22px var(--shadow);
    padding: 20px 14px; cursor: pointer; font-family: inherit; text-align: center; transition: transform 0.15s;
  }
  .slot-btn:active { transform: scale(0.97); }
  .slot-btn.now { box-shadow: 0 0 0 4px var(--accent-dark), 0 8px 22px var(--shadow); }
  .slot-btn.full { opacity: 0.55; cursor: not-allowed; }
  .slot-btn.past { opacity: 0.35; cursor: not-allowed; }
  .slot-btn .time { font-size: clamp(20px, 2.6vw, 28px); font-weight: 700; color: var(--text); }
  .slot-btn .now-badge {
    display: inline-block; font-size: 11px; background: var(--accent-dark); color: white;
    border-radius: 10px; padding: 2px 9px; margin-top: 6px;
  }
  .slot-btn .avail { margin-top: 10px; font-size: clamp(12px, 1.4vw, 14px); color: #a98a92; }
  .slot-btn .avail b { color: var(--ok); font-size: clamp(16px, 2vw, 20px); }
  .slot-btn.full .avail b { color: var(--full); }
  .slot-btn.past .avail b { color: #b89aa2; }
  .slot-btn .avail-label { font-size: 11px; }

  .empty-state { text-align: center; color: #b89aa2; font-size: 16px; margin-top: 40px; }

  /* ---- 등록 모달 ---- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(90, 74, 80, 0.45);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: var(--white); border-radius: 24px; padding: 32px 28px; width: 100%; max-width: 420px;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }
  .modal-card.wide { max-width: 560px; }
  .modal-card h2 { text-align: center; font-size: 20px; margin: 0 0 6px; color: var(--accent-dark); }
  .modal-card .modal-time { text-align: center; font-size: 15px; color: #a98a92; margin-bottom: 20px; }
  .group-count {
    text-align: center; font-size: 12.5px; color: var(--ok); font-weight: 700;
    margin: -12px 0 16px; background: #F0FAF2; border-radius: 10px; padding: 6px;
  }
  .modal-card label { display: block; font-size: 14px; font-weight: 500; margin: 14px 0 6px; }
  .modal-card input {
    width: 100%; padding: 14px; border: 1.5px solid var(--lavender); border-radius: 12px;
    font-family: inherit; font-size: 17px; outline: none;
  }
  .modal-card input:focus { border-color: var(--accent); }
  .modal-hint { font-size: 11.5px; color: #b89aa2; margin: -3px 0 8px; line-height: 1.5; }
  .pad-wrap {
    position: relative; margin-top: 6px; border: 2px dashed var(--accent); border-radius: 14px;
    background: #FFFDFE; overflow: hidden;
  }
  #signature-pad { display: block; width: 100%; height: 170px; touch-action: none; cursor: crosshair; }
  .pad-placeholder {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #d8b8c0; font-size: 13px; pointer-events: none;
  }
  .pad-actions { display: flex; justify-content: flex-end; margin-top: 6px; }
  .btn-clear-sig {
    background: none; border: none; color: var(--accent-dark); font-size: 12px;
    font-weight: 500; cursor: pointer; padding: 4px 8px; font-family: inherit;
  }
  .cat-row { display: flex; gap: 8px; }
  .cat-btn {
    flex: 1; padding: 12px 6px; border-radius: 12px; border: 1.5px solid var(--lavender);
    background: #FDFBFF; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .cat-btn.active { border-color: var(--accent-dark); background: #FDF3F6; color: var(--accent-dark); }
  .sub-field { display: none; }
  .sub-field.show { display: block; }
  .modal-btns { display: flex; gap: 10px; margin-top: 24px; }
  .modal-btns button {
    flex: 1; padding: 15px; border: none; border-radius: 14px; font-family: inherit;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .btn-cancel { background: #FDF3F6; color: var(--accent-dark); }
  .btn-confirm { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: white; }
  .btn-confirm:disabled { opacity: 0.6; cursor: not-allowed; }
  .modal-status { text-align: center; font-size: 13px; margin-top: 12px; min-height: 16px; color: #D97070; }
  .success-check { display: none; text-align: center; padding: 20px 0; }
  .success-check.show { display: block; }
  .success-check .big { font-size: 44px; }
  .success-check .msg { font-size: 17px; font-weight: 700; margin-top: 10px; }

  .conn-dot {
    position: fixed; top: 14px; right: 16px; width: 8px; height: 8px; border-radius: 50%; background: #ccc;
  }
  .conn-dot.on { background: var(--ok); }
  .hidden { display: none !important; }

  /* ---- 우측 하단 플로팅 설정 버튼 ---- */
  .settings-fab {
    position: fixed; bottom: 16px; right: 16px; z-index: 20;
    display: flex; align-items: center; gap: 6px; padding: 12px 18px; border-radius: 30px; border: none;
    background: var(--white); color: var(--accent-dark); font-family: inherit; font-size: 13px; font-weight: 700;
    box-shadow: 0 4px 14px var(--shadow); cursor: pointer;
  }
  .settings-fab:active { transform: scale(0.96); }

  .settings-row { display: flex; gap: 10px; }
  .settings-row > div { flex: 1; }
  .settings-status { text-align: center; font-size: 13px; margin-top: 10px; min-height: 16px; color: #a98a92; }
  .settings-status.err { color: #D97070; }
  .settings-current {
    margin-top: 14px; padding: 10px 12px; background: #FDF3F6; border-radius: 10px;
    font-size: 12.5px; color: var(--accent-dark); font-weight: 700; text-align: center;
  }
  .settings-slot-label { font-size: 12px; font-weight: 500; margin: 16px 0 6px; color: var(--text); }
  .settings-slot-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .settings-slot-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 11px; border: 1.5px solid var(--lavender); border-radius: 10px;
    background: #FDFBFF; font-size: 12.5px;
  }
  .settings-slot-row.now { border-color: var(--accent-dark); background: #FDF3F6; }
  .settings-slot-time { font-weight: 700; }
  .settings-slot-count { color: #a98a92; margin-left: 6px; }
  .settings-slot-del {
    background: none; border: 1px solid #F0A0A8; color: #D97070; border-radius: 8px;
    padding: 4px 9px; font-size: 11px; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .settings-slot-empty { text-align: center; color: #c9a8b0; font-size: 12px; padding: 8px 0; }
  .settings-lock-link {
    display: block; margin: 14px auto 0; text-align: center; font-size: 11.5px; color: #c9a8b0;
    background: none; border: none; cursor: pointer; text-decoration: underline; font-family: inherit;
  }
  .remember-row { display: flex; align-items: center; gap: 6px; margin: 10px 0 0; }
  .remember-row label { display: inline; font-size: 12px; color: #a98a92; margin: 0; }

  .home-fab {
    position: fixed; top: 12px; left: 12px; z-index: 5;
    width: 38px; height: 38px; border-radius: 50%;
    background: white; box-shadow: 0 4px 12px rgba(232,143,162,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; text-decoration: none; color: inherit; border: none; cursor: pointer;
  }
  .home-fab:active { transform: scale(0.94); }
</style>
</head>
<body>
<a href="./index.html" class="home-fab" title="메인으로">🏠</a>
<div class="screen">
  <div class="clock" id="clock">--:--</div>
  <div class="headline">참여하실 시간대를 선택해주세요</div>
  <div class="slots-grid" id="slotsGrid"></div>
  <div class="empty-state hidden" id="emptyState">아직 시간대가 설정되지 않았어요. 스태프에게 문의해주세요.</div>
</div>

<div class="conn-dot" id="connDot"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card wide">
    <div id="formPart">
      <h2>✍️ 참여 등록</h2>
      <div class="modal-time" id="modalTime">-</div>
      <div class="group-count hidden" id="groupCount"></div>

      <label>재직자 여부</label>
      <p class="modal-hint">재직 또는 재학 여부를 선택해주세요. 해당 없으면 일반 시민을 골라주세요.</p>
      <div class="cat-row">
        <button type="button" class="cat-btn" id="catBtn-재직자" onclick="selectCat('재직자')">재직자</button>
        <button type="button" class="cat-btn" id="catBtn-직업계고" onclick="selectCat('직업계고')">직업계고</button>
        <button type="button" class="cat-btn" id="catBtn-대학생" onclick="selectCat('대학생')">대학생</button>
        <button type="button" class="cat-btn" id="catBtn-일반시민" onclick="selectCat('일반시민')">일반 시민</button>
      </div>

      <label>이름 · 소속 · 서명</label>
      <p class="modal-hint" id="writeHint">이름을 적고, 서명까지 아래 칸에 순서대로 적어주세요.</p>
      <div class="pad-wrap">
        <canvas id="signature-pad"></canvas>
        <span class="pad-placeholder" id="padPlaceholder">예) 홍길동 · (서명) ✍️</span>
      </div>
      <div class="pad-actions"><button type="button" class="btn-clear-sig" onclick="clearSignature()">다시 쓰기</button></div>

      <div class="modal-btns">
        <button class="btn-cancel" id="cancelBtn" onclick="closeModal()">취소</button>
        <button class="btn-confirm" id="confirmBtn" onclick="confirmCheckin()">등록하기</button>
      </div>
      <div class="modal-status" id="modalStatus"></div>
    </div>
    <div class="success-check" id="successPart">
      <div class="big">✅</div>
      <div class="msg" id="successMsg">등록 완료!</div>
    </div>
  </div>
</div>

<button type="button" class="settings-fab" onclick="openSettingsModal()">⚙️ 설정</button>

<div class="modal-backdrop" id="settingsBackdrop" onclick="if(event.target===this) closeSettingsModal()">
  <div class="modal-card">
    <div id="settingsLoginArea">
      <h2>🔐 관리자 확인</h2>
      <div class="modal-time">시간대 설정을 바꾸려면 관리자 키가 필요해요.</div>
      <label for="settingsKeyInput">관리자 키</label>
      <input type="password" id="settingsKeyInput" placeholder="관리자 키 입력" onkeydown="if(event.key==='Enter') validateSettingsKey()">
      <div class="remember-row">
        <input type="checkbox" id="settingsRememberKey" style="width:14px;height:14px;">
        <label for="settingsRememberKey">이 기기에 기억하기</label>
      </div>
      <div class="settings-status" id="settingsLoginStatus"></div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeSettingsModal()">닫기</button>
        <button class="btn-confirm" onclick="validateSettingsKey()">확인</button>
      </div>
    </div>
    <div id="settingsConfigArea" class="hidden">
      <h2>⚙️ 시간대 설정</h2>
      <div class="modal-time">오늘 VR체험버스 시간대를 만들거나 다시 설정해요.</div>
      <div class="settings-row">
        <div><label for="cfgStartTime">시작 시간</label><input type="time" id="cfgStartTime" value="09:00"></div>
        <div><label for="cfgEndTime">종료 시간</label><input type="time" id="cfgEndTime" value="17:00"></div>
      </div>
      <div class="settings-row">
        <div><label for="cfgInterval">회차 간격(분)</label><input type="number" id="cfgInterval" value="20" min="5" step="5"></div>
        <div><label for="cfgCapacity">회차당 정원</label><input type="number" id="cfgCapacity" value="10" min="1"></div>
      </div>
      <div class="settings-row">
        <div><label for="cfgLunchStart">점심시간 시작 (선택)</label><input type="time" id="cfgLunchStart"></div>
        <div><label for="cfgLunchEnd">점심시간 종료 (선택)</label><input type="time" id="cfgLunchEnd"></div>
      </div>
      <div class="settings-current" id="settingsCurrent">시간대 아직 없음</div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeSettingsModal()">닫기</button>
        <button class="btn-confirm" onclick="applySettingsConfig()">시간대 생성 / 다시 만들기</button>
      </div>

      <div class="settings-slot-label">현재 시간대 (개별 삭제 가능)</div>
      <div class="settings-slot-list" id="settingsSlotList"></div>

      <button type="button" class="settings-lock-link" onclick="lockSettings()">🔒 다시 잠그기</button>
    </div>
  </div>
</div>

<script>
  const WORKER_HTTP_URL = 'https://signform.hyunra94.workers.dev';
  const WS_URL_BASE = WORKER_HTTP_URL.replace(/^http/, 'ws');

  // 서명 중 글자/이미지가 선택되거나 드래그되는 것 방지
  document.addEventListener('dragstart', (e) => e.preventDefault());
  document.addEventListener('selectstart', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  const queueDate = todayStr();
  let ws = null;
  let currentData = { slots: [] };
  let pendingSlotIndex = null;
  let selectedCat = '';
  let groupCount = 0;

  function openWebSocket() {
    ws = new WebSocket(`${WS_URL_BASE}/queue/ws?date=${queueDate}`);
    ws.onopen = () => document.getElementById('connDot').classList.add('on');
    ws.onclose = () => { document.getElementById('connDot').classList.remove('on'); setTimeout(openWebSocket, 2000); };
    ws.onerror = () => document.getElementById('connDot').classList.remove('on');
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'state') { currentData = msg.data; renderSlots(); }
    };
  }
  openWebSocket();

  function send(payload) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload)); }

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  }
  updateClock();
  setInterval(() => { updateClock(); renderSlots(); }, 15000);

  function minutesNow() {
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes();
  }

  function currentSlotIndex(slots) {
    const nowMin = minutesNow();
    let best = -1;
    slots.forEach((s, i) => {
      const [h, m] = s.time.split(':').map(Number);
      if (h * 60 + m <= nowMin) best = i;
    });
    return best;
  }

  // 하루 전체 시간대를 다 보여줌 (지난 시간대는 흐리게 표시만, 숨기지 않음)
  function renderSlots() {
    const grid = document.getElementById('slotsGrid');
    const emptyState = document.getElementById('emptyState');
    const slots = currentData.slots || [];

    if (slots.length === 0) {
      grid.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');

    if (!document.getElementById('settingsConfigArea').classList.contains('hidden')) {
      updateSettingsCurrent();
      renderSettingsSlotList();
    }

    const nowIdx = currentSlotIndex(slots);
    grid.innerHTML = slots.map((s, i) => {
      const isFull = s.entries.length >= s.capacity;
      const isCurrent = i === nowIdx;
      const isPast = nowIdx >= 0 && i < nowIdx;
      const remain = Math.max(s.capacity - s.entries.length, 0);
      const disabled = isFull || isPast;
      return `
        <button class="slot-btn ${isCurrent ? 'now' : ''} ${isFull ? 'full' : ''} ${isPast ? 'past' : ''}"
                ${disabled ? 'disabled' : ''} onclick="openModal(${i})">
          <div class="time">${s.time}${isCurrent ? '<div class="now-badge">지금 시간대</div>' : ''}</div>
          <div class="avail">
            ${isPast ? '종료' : isFull
              ? '마감'
              : `<b>${remain}</b><span class="avail-label">자리 남음 (${s.entries.length}/${s.capacity})</span>`}
          </div>
        </button>
      `;
    }).join('');
  }

  // 직업계고/대학생은 UI 선택지일 뿐, 실제 저장되는 값은 '미래인재'로 합쳐짐
  const isFutureTalent = (value) => value === '직업계고' || value === '대학생';
  function selectCat(cat) {
    selectedCat = cat;
    ['재직자', '직업계고', '대학생', '일반시민'].forEach(c => {
      document.getElementById(`catBtn-${c}`).classList.toggle('active', c === cat);
    });
    const hintEl = document.getElementById('writeHint');
    if (cat === '재직자') hintEl.textContent = '이름, 회사명, 서명을 아래 칸에 순서대로 적어주세요.';
    else if (isFutureTalent(cat)) hintEl.textContent = '이름, 학교명, 서명을 아래 칸에 순서대로 적어주세요.';
    else if (cat === '일반시민') hintEl.textContent = '이름과 서명을 아래 칸에 적어주세요.';
    else hintEl.textContent = '이름을 적고, 서명까지 아래 칸에 순서대로 적어주세요.';
  }

  let signaturePad = null;
  const sigCanvas = document.getElementById('signature-pad');
  const sigPlaceholder = document.getElementById('padPlaceholder');

  // 캔버스 전체가 아니라 실제 잉크가 그려진 영역만 여백을 살짝 두고 잘라서 내보냄
  // (세로로 긴 큰 캔버스에 작게 그려진 필기가 PDF의 넓은 병합 칸에 맞춰지면서
  //  더 작아 보이는 문제를 완화 — 캔버스 크기/비율과 상관없이 항상 칸을 꽉 채움)
  function cropPadToDataUrl(canvasEl, padInstance, marginRatio = 0.15) {
    const data = padInstance.toData();
    if (!data || !data.length) return canvasEl.toDataURL('image/png');

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    data.forEach((group) => group.points.forEach((p) => {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    }));

    const w = canvasEl.offsetWidth || 1;
    const h = canvasEl.offsetHeight || 1;
    const marginX = Math.max((maxX - minX) * marginRatio, 6);
    const marginY = Math.max((maxY - minY) * marginRatio, 6);
    minX = Math.max(0, minX - marginX);
    minY = Math.max(0, minY - marginY);
    maxX = Math.min(w, maxX + marginX);
    maxY = Math.min(h, maxY + marginY);

    const ratio = canvasEl.width / w; // 캔버스 실제 해상도 배율(devicePixelRatio 반영)
    const sx = minX * ratio, sy = minY * ratio;
    const sw = Math.max((maxX - minX) * ratio, 1);
    const sh = Math.max((maxY - minY) * ratio, 1);

    // 서버가 PDF 만들 때 메모리를 너무 많이 안 먹도록 최종 이미지 크기를 적당히 제한
    // (이름+소속+서명을 한 칸에 합쳐 넣는 화면이라 다른 곳보다 살짝 여유를 둠)
    const MAX_DIM = 800;
    const scale = Math.min(1, MAX_DIM / Math.max(sw, sh));
    const outW = Math.max(1, Math.round(sw * scale));
    const outH = Math.max(1, Math.round(sh * scale));

    const out = document.createElement('canvas');
    out.width = outW; out.height = outH;
    out.getContext('2d').drawImage(canvasEl, sx, sy, sw, sh, 0, 0, outW, outH);
    return out.toDataURL('image/png');
  }

  function initOrResizeSignaturePad() {
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const savedData = signaturePad ? signaturePad.toData() : null;
    sigCanvas.width = sigCanvas.offsetWidth * ratio;
    sigCanvas.height = sigCanvas.offsetHeight * ratio;
    sigCanvas.getContext('2d').scale(ratio, ratio);
    if (!signaturePad) {
      signaturePad = new SignaturePad(sigCanvas, {
        backgroundColor: 'rgba(255,255,255,0)', penColor: '#5A4A50', minWidth: 1.2, maxWidth: 3.5,
      });
      signaturePad.addEventListener('beginStroke', () => { sigPlaceholder.style.display = 'none'; });
    } else {
      signaturePad.clear();
      if (savedData && savedData.length) signaturePad.fromData(savedData);
    }
  }
  window.addEventListener('resize', () => { if (signaturePad) initOrResizeSignaturePad(); });

  function clearSignature() {
    if (signaturePad) signaturePad.clear();
    sigPlaceholder.style.display = 'block';
  }

  let checkinInProgress = false;

  function openModal(index) {
    pendingSlotIndex = index;
    selectedCat = '';
    groupCount = 0;
    checkinInProgress = false;
    document.getElementById('confirmBtn').disabled = false;
    document.getElementById('groupCount').classList.add('hidden');
    document.getElementById('cancelBtn').textContent = '취소';
    const slot = currentData.slots[index];
    document.getElementById('modalTime').textContent = `${slot.time} 시간대`;
    document.getElementById('writeHint').textContent = '이름을 적고, 서명까지 아래 칸에 순서대로 적어주세요.';
    ['재직자', '직업계고', '대학생', '일반시민'].forEach(c => document.getElementById(`catBtn-${c}`).classList.remove('active'));
    document.getElementById('modalStatus').textContent = '';
    document.getElementById('formPart').style.display = 'block';
    document.getElementById('successPart').classList.remove('show');
    document.getElementById('modalBackdrop').classList.add('open');
    initOrResizeSignaturePad();
    sigPlaceholder.style.display = 'block';
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
    pendingSlotIndex = null;
    groupCount = 0;
    checkinInProgress = false;
  }

  async function confirmCheckin() {
    if (checkinInProgress) return; // 연타/중복 전송 방지 (같은 사람이 여러 번 타는 건 정상이라 서버 중복체크는 없음)
    const statusEl = document.getElementById('modalStatus');
    if (!selectedCat) { statusEl.textContent = '재직자 여부를 선택해주세요.'; return; }
    if (!signaturePad || signaturePad.isEmpty()) { statusEl.textContent = '이름과 서명을 적어주세요.'; return; }
    if (pendingSlotIndex === null) return;

    checkinInProgress = true;
    document.getElementById('confirmBtn').disabled = true;

    // 직업계고/대학생은 화면 선택지일 뿐, 서명록에는 '미래인재'로 합쳐서 저장됨
    const 재직자여부 = isFutureTalent(selectedCat) ? '미래인재' : selectedCat;
    // 이름+소속+서명을 한 캔버스에 필기로 받음 (텍스트 성명은 없음)
    const 필기이미지 = cropPadToDataUrl(sigCanvas, signaturePad);

    statusEl.textContent = '등록 중...';
    statusEl.style.color = '#a98a92';

    try {
      const res = await fetch(`${WORKER_HTTP_URL}/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          programId: `${queueDate}-vr`,
          재직자여부, 필기이미지, 동의: true,
        }),
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok) {
        statusEl.textContent = result.error || '등록에 실패했어요. 스태프에게 문의해주세요.';
        statusEl.style.color = '#D97070';
        checkinInProgress = false;
        document.getElementById('confirmBtn').disabled = false;
        return;
      }
    } catch (err) {
      statusEl.textContent = '서버 연결에 실패했어요. 스태프에게 문의해주세요.';
      statusEl.style.color = '#D97070';
      checkinInProgress = false;
      document.getElementById('confirmBtn').disabled = false;
      return;
    }

    // 서명록 등록 성공 → 시간대 대기열에도 등록 (이름은 필기 이미지 안에만 있어서 명단에는 빈 이름으로 기록됨)
    send({ type: 'checkin', slotIndex: pendingSlotIndex, 성명: '', 재직자여부, 회사명: '', 학교명: '' });

    document.getElementById('formPart').style.display = 'none';
    document.getElementById('successMsg').textContent = '등록 완료!';
    document.getElementById('successPart').classList.add('show');

    // 같은 시간대로 계속 등록할 수 있게 모달은 유지 — 폼만 비워서 다음 사람 바로 입력 가능
    groupCount += 1;
    setTimeout(() => {
      const slot = currentData.slots[pendingSlotIndex];
      const isFull = slot && slot.entries.length >= slot.capacity;
      if (isFull) {
        // 방금 등록으로 정원이 다 찼으면 자동으로 닫음
        closeModal();
        return;
      }
      resetModalForm();
      checkinInProgress = false;
      document.getElementById('confirmBtn').disabled = false;
      document.getElementById('successPart').classList.remove('show');
      document.getElementById('formPart').style.display = 'block';
      const gc = document.getElementById('groupCount');
      gc.textContent = `이번 시간대에 지금까지 ${groupCount}명 등록됐어요`;
      gc.classList.remove('hidden');
      document.getElementById('cancelBtn').textContent = '그만 등록할게요';
    }, 1300);
  }

  function resetModalForm() {
    selectedCat = '';
    document.getElementById('writeHint').textContent = '이름을 적고, 서명까지 아래 칸에 순서대로 적어주세요.';
    ['재직자', '직업계고', '대학생', '일반시민'].forEach(c => document.getElementById(`catBtn-${c}`).classList.remove('active'));
    document.getElementById('modalStatus').textContent = '';
    clearSignature();
  }

  // ---------- 시간대 설정 (우측 하단 플로팅 버튼, 관리자 키 필요) ----------
  let settingsAdminKey = '';

  function openSettingsModal() {
    document.getElementById('settingsBackdrop').classList.add('open');
    if (settingsAdminKey) { showSettingsConfig(); return; }
    const saved = localStorage.getItem('admin_key');
    if (saved) {
      document.getElementById('settingsKeyInput').value = saved;
      document.getElementById('settingsRememberKey').checked = true;
      validateSettingsKey();
    } else {
      showSettingsLogin();
    }
  }
  function closeSettingsModal() {
    document.getElementById('settingsBackdrop').classList.remove('open');
  }
  function showSettingsLogin() {
    document.getElementById('settingsLoginArea').classList.remove('hidden');
    document.getElementById('settingsConfigArea').classList.add('hidden');
    document.getElementById('settingsKeyInput').focus();
  }
  function showSettingsConfig() {
    document.getElementById('settingsLoginArea').classList.add('hidden');
    document.getElementById('settingsConfigArea').classList.remove('hidden');
    updateSettingsCurrent();
    renderSettingsSlotList();
  }
  function lockSettings() {
    settingsAdminKey = '';
    document.getElementById('settingsLoginStatus').textContent = '';
    showSettingsLogin();
  }

  async function validateSettingsKey() {
    const key = document.getElementById('settingsKeyInput').value.trim();
    const statusEl = document.getElementById('settingsLoginStatus');
    if (!key) { statusEl.textContent = '관리자 키를 입력해주세요.'; statusEl.className = 'settings-status err'; return; }
    statusEl.textContent = '확인 중...';
    statusEl.className = 'settings-status';
    try {
      const res = await fetch(`${WORKER_HTTP_URL}/admin/rows?programId=${encodeURIComponent(queueDate + '-vr')}&key=${encodeURIComponent(key)}`);
      if (res.status === 401) {
        statusEl.textContent = '관리자 키가 올바르지 않아요.';
        statusEl.className = 'settings-status err';
        return;
      }
      if (!res.ok) { statusEl.textContent = '확인 중 오류가 발생했어요.'; statusEl.className = 'settings-status err'; return; }
      settingsAdminKey = key;
      if (document.getElementById('settingsRememberKey').checked) localStorage.setItem('admin_key', key);
      else localStorage.removeItem('admin_key');
      statusEl.textContent = '';
      showSettingsConfig();
    } catch (err) {
      statusEl.textContent = '서버 연결에 실패했어요.';
      statusEl.className = 'settings-status err';
    }
  }

  function updateSettingsCurrent() {
    const el = document.getElementById('settingsCurrent');
    const slots = currentData.slots || [];
    if (slots.length === 0) { el.textContent = '시간대 아직 없음'; return; }
    const totalCount = slots.reduce((s, x) => s + x.entries.length, 0);
    const totalCapacity = slots.reduce((s, x) => s + x.capacity, 0);
    el.textContent = `${slots[0].time} ~ ${slots[slots.length - 1].time} · ${slots.length}개 시간대 · 누적 ${totalCount}/${totalCapacity}명`;
  }

  function renderSettingsSlotList() {
    const listEl = document.getElementById('settingsSlotList');
    const slots = currentData.slots || [];
    if (slots.length === 0) {
      listEl.innerHTML = '<div class="settings-slot-empty">아직 시간대가 없어요.</div>';
      return;
    }
    const nowIdx = currentSlotIndex(slots);
    listEl.innerHTML = slots.map((s, i) => `
      <div class="settings-slot-row ${i === nowIdx ? 'now' : ''}">
        <span><span class="settings-slot-time">${s.time}</span><span class="settings-slot-count">${s.entries.length}/${s.capacity}명</span></span>
        <button type="button" class="settings-slot-del" onclick="removeSettingsSlot(${i}, '${s.time}')">삭제</button>
      </div>
    `).join('');
  }

  function removeSettingsSlot(index, time) {
    const slot = currentData.slots[index];
    const count = slot ? slot.entries.length : 0;
    const warn = count > 0 ? `\n(등록된 ${count}명도 같이 삭제돼요)` : '';
    if (!confirm(`${time} 시간대를 통째로 삭제할까요?${warn}`)) return;
    send({ type: 'removeSlot', slotIndex: index });
  }

  function applySettingsConfig() {
    const startTime = document.getElementById('cfgStartTime').value || '09:00';
    const endTime = document.getElementById('cfgEndTime').value || '17:00';
    const intervalMinutes = Number(document.getElementById('cfgInterval').value) || 20;
    const capacity = Number(document.getElementById('cfgCapacity').value) || 10;
    const lunchStart = document.getElementById('cfgLunchStart').value || null;
    const lunchEnd = document.getElementById('cfgLunchEnd').value || null;
    if ((currentData.slots || []).length > 0 &&
        !confirm('시간대를 다시 만들까요? 같은 시간이 겹치면 그 명단은 유지되고, 새 범위 밖으로 벗어난 시간대의 명단만 사라져요.')) return;
    send({ type: 'configure', startTime, endTime, intervalMinutes, capacity, lunchStart, lunchEnd });
    closeSettingsModal();
  }
</script>
</body>
</html>
