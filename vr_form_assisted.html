<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR체험버스 - 담당자 접수 (PC)</title>
<link rel="icon" href="https://hyunra94.github.io/assets/favicon.png">
<meta property="og:image" content="https://hyunra94.github.io/assets/og-default.png">
<meta property="og:url" content="https://hyunra94.github.io/[레포명]/">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg-1: #EEF2F8; --bg-2: #E4ECF7;
    --accent: #4A6FA5; --accent-dark: #2F4C7A;
    --lavender: #D7E0F0; --text: #2B3A4A; --white: #FFFFFF;
    --shadow: rgba(74, 111, 165, 0.25);
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    margin: 0; padding: clamp(10px, 3vh, 24px) 16px; color: var(--text);
    min-height: 100%; overflow-y: auto;
  }
  #fitWrap { width: 100%; display: flex; justify-content: center; }
  .card {
    max-width: 480px; margin: 0 auto; background: var(--white);
    border-radius: 20px; box-shadow: 0 8px 24px var(--shadow);
    padding: clamp(16px, 3vh, 28px) clamp(16px, 4vw, 24px);
    transition: max-width 0.2s ease;
  }
  @media (min-width: 860px) {
    .card { max-width: 880px; padding: 36px 40px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
    .form-col-right { position: sticky; top: 20px; }
  }
  h1 { font-size: 19px; font-weight: 700; text-align: center; margin: 0 0 4px; color: var(--accent-dark); }
  .subtitle { text-align: center; font-size: 12.5px; color: #7C8FA3; margin-bottom: 20px; }

  .session-choice { display: flex; flex-direction: column; gap: 14px; }
  .choice-btn {
    padding: 16px; border-radius: 14px; border: none; font-family: inherit;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .choice-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: white; box-shadow: 0 4px 12px var(--shadow);
  }
  .choice-btn.secondary { background: #EDF2F8; color: var(--accent-dark); border: 1.5px solid var(--accent); }
  .join-row { display: flex; gap: 8px; }
  .join-row input {
    flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 1.5px solid var(--lavender);
    font-family: inherit; font-size: clamp(16px, 5vw, 20px); text-align: center;
    letter-spacing: clamp(2px, 1.5vw, 5px);
  }

  .code-display {
    position: relative; text-align: center; padding: clamp(14px, 5vw, 22px); background: #EDF2F8;
    border-radius: 16px; margin-bottom: 18px; overflow: hidden;
  }
  .code-display .code {
    font-size: clamp(28px, 12vw, 44px); font-weight: 700;
    letter-spacing: clamp(3px, 3vw, 8px); color: var(--accent-dark); white-space: nowrap;
  }
  .code-display .label { font-size: clamp(10px, 3vw, 12px); color: #7C8FA3; margin-top: 4px; }
  .code-display-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .code-display-text { flex: 1; }
  .qr-box {
    flex-shrink: 0; background: white; padding: 6px; border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); line-height: 0;
  }
  .qr-box img, .qr-box canvas { display: block; width: 76px; height: 76px; }
  .code-toggle-btn {
    position: absolute; top: 6px; right: 8px; width: 24px; height: 24px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.7); color: var(--accent-dark); font-size: 11px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s;
  }
  .code-display-inner {
    max-height: 200px; overflow: hidden; transition: max-height 0.25s ease, opacity 0.25s ease, margin 0.25s ease;
  }
  .code-display.collapsed { padding-top: 8px; padding-bottom: 8px; }
  .code-display.collapsed .code-display-inner { max-height: 0; opacity: 0; }
  .code-display.collapsed .code-toggle-btn { transform: rotate(180deg); }

  .conn-status {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: #7C8FA3; margin-bottom: 14px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
  .btn-plain {
    background: none; border: none; color: var(--accent-dark); font-size: 11.5px;
    text-decoration: underline; cursor: pointer; padding: 0; margin-left: 4px;
  }
  .dot.on { background: #6FA875; }
  .dot.off { background: #D97070; }

  label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; color: var(--text); }
  input[type="text"] {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--lavender); border-radius: 12px;
    font-family: inherit; font-size: 14px; background: #F7F9FC; outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); }

  .field-hint { font-size: 11.5px; color: #8494A8; margin: -3px 0 8px; line-height: 1.5; }

  /* ---- 재직자 여부: 담당자가 직접 선택 ---- */
  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cat-btn {
    padding: 12px 4px; border-radius: 14px; border: 2px solid var(--lavender);
    background: #F7F9FC; color: var(--text); font-family: inherit; font-size: 12.5px; font-weight: 700;
    cursor: pointer;
  }
  .cat-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); border-color: var(--accent-dark); color: white; }

  .hidden-field {
    overflow: hidden; max-height: 0; opacity: 0;
    transition: max-height 0.25s ease, opacity 0.25s ease;
  }
  .hidden-field.show { max-height: 100px; opacity: 1; }

  /* ---- 선택 시간대: 키오스크에서 고른 걸 읽기전용으로 표시 ---- */
  .slot-mirror-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border: 1.5px dashed var(--accent); border-radius: 12px; background: #F7F9FC;
  }
  .slot-mirror-row .val { flex: 1; font-size: 16px; font-weight: 700; color: var(--text); }
  .slot-mirror-row .val.empty { color: #9FB0C4; font-weight: 400; font-size: 13px; }
  .slot-mirror-row .icon { font-size: 17px; }

  .signature-section { margin-top: 22px; }
  .pen-only-row {
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12px; color: var(--text);
  }
  .pen-only-row input { width: 15px; height: 15px; accent-color: var(--accent-dark); cursor: pointer; }
  .pen-only-label { cursor: pointer; }
  .pad-wrap {
    position: relative; border: 2px dashed var(--accent); border-radius: 14px;
    background: #FBFCFE; overflow: hidden;
  }
  #live-preview-canvas {
    display: block; width: 100%; aspect-ratio: 2.2 / 1;
  }
  .live-indicator {
    display: none; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 10px;
    background: #FFF8E8; border-radius: 10px; font-size: 12px; color: #b8860b;
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #e8a020; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .pad-placeholder {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #B7C4D3; font-size: 13px; pointer-events: none; text-align: center;
  }
  .remote-sig-badge {
    display: none; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px;
    background: #F0FAF2; border-radius: 10px; font-size: 12.5px; color: #4a7d52;
  }
  .remote-sig-badge img { height: 32px; border-radius: 4px; }

  .confirm-summary {
    margin-top: 18px; padding: 14px 16px; border-radius: 14px;
    background: #EDF2F8; border: 1.5px solid var(--accent);
  }
  .confirm-summary .confirm-title { font-size: 12px; font-weight: 700; color: var(--accent-dark); margin-bottom: 8px; }
  .confirm-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 14px; }
  .confirm-row .confirm-label { color: #7C8FA3; font-weight: 500; flex-shrink: 0; }
  .confirm-row .confirm-val { font-weight: 700; color: var(--text); text-align: right; }
  .confirm-row .confirm-val.empty { color: #9FB0C4; font-weight: 400; }

  .kiosk-note {
    margin-top: 22px; padding: 12px 14px; border-radius: 12px; background: #F5F8FB;
    font-size: 12.5px; color: #7C8FA3; text-align: center; line-height: 1.6;
  }

  .status { text-align: center; font-size: 13px; margin-top: 12px; min-height: 18px; }
  .status.ok { color: #6FA875; }
  .status.err { color: #D97070; }

  .hidden { display: none !important; }

  .home-fab {
    position: fixed; top: 12px; left: 12px; z-index: 5;
    width: 38px; height: 38px; border-radius: 50%;
    background: white; box-shadow: 0 4px 12px rgba(74,111,165,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; text-decoration: none; color: inherit; border: none; cursor: pointer;
  }
  .home-fab:active { transform: scale(0.94); }
</style>
</head>
<body>
<a href="./index.html" class="home-fab" title="메인으로">🏠</a>

<div id="fitWrap">
<div class="card">
  <h1>🚌 VR체험버스 담당자 접수</h1>
  <p class="subtitle" id="subtitleText">담당자가 이름·소속을 입력하고, 참석자는 키오스크에서 시간대 선택·서명만 해요</p>

  <!-- 세션 선택 화면 -->
  <div id="sessionChoice" class="session-choice">
    <button class="choice-btn primary" onclick="startNewSession()">새 세션 시작하기</button>
    <div class="join-row">
      <input type="text" id="joinCodeInput" placeholder="0000" maxlength="4" inputmode="numeric">
      <button class="choice-btn secondary" onclick="joinExistingSession()">참가하기</button>
    </div>
  </div>

  <!-- 폼 화면 -->
  <div id="formArea" class="hidden">
    <div class="code-display" id="codeDisplay">
      <button class="code-toggle-btn" onclick="toggleCodeDisplay()" title="코드 숨기기/보이기">▲</button>
      <div class="code-display-inner" id="codeDisplayInner">
        <div class="code-display-row">
          <div class="code-display-text">
            <div class="code" id="codeText">----</div>
            <div class="label">참석자 키오스크에서 이 코드로 참가하세요</div>
          </div>
          <div class="qr-box" id="qrBox"></div>
        </div>
      </div>
    </div>
    <div class="conn-status">
      <span class="dot" id="connDot"></span><span id="connText">연결 중...</span>
      <button class="btn-plain" onclick="changeSession()">코드 변경</button>
    </div>

    <div class="form-grid">
      <div class="form-col-left">
        <label for="name">성명</label>
        <input type="text" id="name" placeholder="참석자에게 성함을 여쭤보고 입력하세요">

        <label>재직자 여부</label>
        <div class="cat-grid">
          <button type="button" class="cat-btn" id="catBtn-재직자" onclick="selectCat('재직자')">재직자</button>
          <button type="button" class="cat-btn" id="catBtn-대학생" onclick="selectCat('대학생')">대학생</button>
          <button type="button" class="cat-btn" id="catBtn-직업계고" onclick="selectCat('직업계고')">직업계고</button>
          <button type="button" class="cat-btn" id="catBtn-일반시민" onclick="selectCat('일반시민')">일반 시민</button>
        </div>

        <div id="companyField" class="hidden-field">
          <label for="company">회사명</label>
          <input type="text" id="company" placeholder="재직 중인 회사명을 입력하세요">
        </div>
        <div id="schoolField" class="hidden-field">
          <label for="school">학교명</label>
          <input type="text" id="school" placeholder="재학 중인 학교명을 입력하세요">
        </div>

        <label>선택 시간대</label>
        <div class="slot-mirror-row">
          <span class="val empty" id="slotVal">아직 키오스크에서 선택 전이에요</span>
          <span class="icon">🕐</span>
        </div>
      </div>

      <div class="form-col-right">
        <div class="signature-section">
          <label>서명 미리보기 (키오스크에서 서명)</label>
          <div class="pen-only-row">
            <input type="checkbox" id="penOnlyToggle" onchange="togglePenOnly(this.checked)">
            <label for="penOnlyToggle" class="pen-only-label">✒️ 펜으로만 서명 받기 (손가락 터치 차단)</label>
          </div>
          <div class="pad-wrap">
            <canvas id="live-preview-canvas"></canvas>
            <span class="pad-placeholder" id="pad-placeholder">참석자가 키오스크에 서명하면 여기 보여요 ✍️</span>
          </div>
          <div class="live-indicator" id="liveIndicator">
            <span class="live-dot"></span><span>키오스크에서 실시간으로 서명 중...</span>
          </div>
          <div class="remote-sig-badge" id="remoteSigBadge">
            <img id="remoteSigImg" src="" alt="서명">
            <span id="remoteSigText">서명 완료됨</span>
          </div>
        </div>

        <div class="confirm-summary" id="confirmSummary">
          <div class="confirm-title">✅ 참석자에게 확인해주세요</div>
          <div class="confirm-row"><span class="confirm-label">성함</span><span class="confirm-val empty" id="cfName">-</span></div>
          <div class="confirm-row"><span class="confirm-label">소속</span><span class="confirm-val empty" id="cfAffil">-</span></div>
          <div class="confirm-row"><span class="confirm-label">시간대</span><span class="confirm-val empty" id="cfSlot">-</span></div>
        </div>

        <div class="kiosk-note">참석자가 키오스크에서 시간대를 고르고 서명을 마치면 자동으로 제출·등록돼요. 여기서는 따로 제출할 필요 없어요.</div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
  // ⚠️ 배포된 Worker 주소로 교체하세요 (http/https 그대로)
  const WORKER_HTTP_URL = 'https://signform.hyunra94.workers.dev';
  const WS_URL_BASE = WORKER_HTTP_URL.replace(/^http/, 'ws');

  const SETTINGS_KEY = 'signform_settings';
  function todayStr() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function loadFormSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { date: todayStr(), place: '전주MBC' };
  }

  let ws = null;
  let intentionalDisconnect = false;
  let sessionCode = null;
  let suppressEcho = false;
  let subCatLocal = ''; // 직업계고/대학생 중 어느 쪽인지(로컬 표시용, 서버엔 '미래인재'로만 전송)

  const liveCanvas = document.getElementById('live-preview-canvas');
  const placeholder = document.getElementById('pad-placeholder');
  const remoteBadge = document.getElementById('remoteSigBadge');
  const remoteImg = document.getElementById('remoteSigImg');
  const liveIndicator = document.getElementById('liveIndicator');
  let lastRemoteSignature = '';

  function prepareLiveCanvas() {
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const rect = liveCanvas.getBoundingClientRect();
    const w = rect.width || 1;
    const h = rect.height || 1;
    liveCanvas.width = w * ratio;
    liveCanvas.height = h * ratio;
    const ctx = liveCanvas.getContext('2d');
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { ctx, w, h };
  }

  function drawLiveStrokes(strokes) {
    const { ctx, w, h } = prepareLiveCanvas();
    ctx.strokeStyle = '#2B3A4A';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    (strokes || []).forEach(stroke => {
      if (!stroke || stroke.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(stroke[0][0] * w, stroke[0][1] * h);
      for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i][0] * w, stroke[i][1] * h);
      ctx.stroke();
    });
  }

  function drawSignatureImageOnLiveCanvas(dataUrl) {
    if (!dataUrl) return;
    const img = new Image();
    img.onload = () => {
      const { ctx, w, h } = prepareLiveCanvas();
      ctx.drawImage(img, 0, 0, w, h);
    };
    img.src = dataUrl;
  }

  function clearLiveCanvas() { prepareLiveCanvas(); }
  window.addEventListener('resize', () => {
    if (lastRemoteSignature) drawSignatureImageOnLiveCanvas(lastRemoteSignature);
    else clearLiveCanvas();
  });

  function randomCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

  function startNewSession() { connectSession(randomCode()); }

  function joinExistingSession() {
    const code = document.getElementById('joinCodeInput').value.trim();
    if (!/^\d{4}$/.test(code)) { alert('4자리 숫자 코드를 입력해주세요.'); return; }
    connectSession(code);
  }
  document.getElementById('joinCodeInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); joinExistingSession(); }
  });

  function connectSession(code) {
    sessionCode = code;
    document.getElementById('sessionChoice').classList.add('hidden');
    document.getElementById('formArea').classList.remove('hidden');
    document.getElementById('codeText').textContent = code;
    document.getElementById('subtitleText').textContent = '세션에 연결되었습니다';
    clearLiveCanvas();
    openWebSocket();
    generateJoinQr(code);
    document.getElementById('codeDisplay').classList.add('collapsed');
    setTimeout(() => document.getElementById('name').focus(), 100);
  }

  function generateJoinQr(code) {
    const box = document.getElementById('qrBox');
    box.innerHTML = '';
    try {
      const kioskUrl = new URL('vr_pad_kiosk.html?code=' + encodeURIComponent(code), window.location.href).href;
      new QRCode(box, {
        text: kioskUrl, width: 76, height: 76,
        colorDark: '#2F4C7A', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M,
      });
    } catch (e) {
      console.error('QR 생성 실패:', e);
      box.textContent = 'QR 생성 실패';
    }
  }

  function toggleCodeDisplay() { document.getElementById('codeDisplay').classList.toggle('collapsed'); }

  let autoCollapsedOnce = false;
  function handlePeers(count) {
    if (count >= 2 && !autoCollapsedOnce) {
      autoCollapsedOnce = true;
      const codeDisplay = document.getElementById('codeDisplay');
      if (!codeDisplay.classList.contains('collapsed')) codeDisplay.classList.add('collapsed');
      setConnStatus(true, `실시간 연결됨 · 키오스크 ${count - 1}대 참가 중`);
    } else if (ws && ws.readyState === WebSocket.OPEN) {
      setConnStatus(true, count >= 2 ? `실시간 연결됨 · 키오스크 ${count - 1}대 참가 중` : '실시간 연결됨 · 키오스크 연결 대기 중');
    }
    if (count >= 2) send({ type: 'hint', kind: 'penOnly', value: penOnlyEnabled });
  }

  // ---------- 펜 전용 서명 설정 ----------
  let penOnlyEnabled = false;
  function togglePenOnly(checked) {
    penOnlyEnabled = checked;
    send({ type: 'hint', kind: 'penOnly', value: checked });
    showStatus(checked ? '펜 전용 모드로 전환했어요. 키오스크에서 손가락 터치가 차단돼요.' : '펜 전용 모드를 껐어요.', '');
  }

  function changeSession() {
    if (!confirm('다른 세션 코드로 바꿀까요? 지금 입력 중인 내용은 사라져요.')) return;
    intentionalDisconnect = true;
    if (ws) ws.close();
    document.getElementById('formArea').classList.add('hidden');
    document.getElementById('sessionChoice').classList.remove('hidden');
    document.getElementById('subtitleText').textContent = '담당자가 이름·소속을 입력하고, 참석자는 키오스크에서 시간대 선택·서명만 해요';
    document.getElementById('joinCodeInput').value = '';
    sessionCode = null;
    autoCollapsedOnce = false;
    document.getElementById('codeDisplay').classList.remove('collapsed');
  }

  function openWebSocket() {
    setConnStatus(false, '연결 중...');
    ws = new WebSocket(`${WS_URL_BASE}/ws?session=${sessionCode}`);

    ws.onopen = () => {
      setConnStatus(true, '실시간 연결됨 · 키오스크 연결 대기 중');
      const settings = loadFormSettings();
      const programId = `${settings.date || todayStr()}-vr`;
      send({ type: 'update', field: 'programId', value: programId });
      send({ type: 'update', field: '장소', value: settings.place || '전주MBC' });
      // VR체험버스는 별도 동의 문구가 없는 서식이라 자동으로 동의 처리
      send({ type: 'update', field: '동의', value: true });
    };
    ws.onclose = () => {
      if (intentionalDisconnect) { intentionalDisconnect = false; return; }
      setConnStatus(false, '연결 끊김 - 재연결 중...');
      setTimeout(openWebSocket, 2000);
    };
    ws.onerror = () => setConnStatus(false, '연결 오류');

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'state') applyRemoteState(msg.data);
      else if (msg.type === 'submitted') onSubmitted(msg.result);
      else if (msg.type === 'error') showStatus(msg.message, 'err');
      else if (msg.type === 'strokeLive') handleLiveStroke(msg);
      else if (msg.type === 'peers') handlePeers(msg.count);
      else if (msg.type === 'hint' && msg.kind === 'padAspect') liveCanvas.style.aspectRatio = msg.value;
    };
  }

  function setConnStatus(on, text) {
    document.getElementById('connDot').className = 'dot ' + (on ? 'on' : 'off');
    document.getElementById('connText').textContent = text;
  }

  function send(payload) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
  }

  // ---------- 재직자 여부 선택 (담당자가 직접) ----------
  const isFutureTalent = (v) => v === '직업계고' || v === '대학생';
  function selectCat(cat) {
    ['재직자', '직업계고', '대학생', '일반시민'].forEach(c => {
      document.getElementById(`catBtn-${c}`).classList.toggle('active', c === cat);
    });
    subCatLocal = isFutureTalent(cat) ? cat : '';
    const stored = isFutureTalent(cat) ? '미래인재' : cat;
    send({ type: 'update', field: '재직자여부', value: stored });
    document.getElementById('companyField').classList.toggle('show', stored === '재직자');
    document.getElementById('schoolField').classList.toggle('show', stored === '미래인재');
    if (stored === '재직자') setTimeout(() => document.getElementById('company').focus(), 120);
    else if (stored === '미래인재') setTimeout(() => document.getElementById('school').focus(), 120);
    renderConfirmSummary();
  }

  function setCf(id, text) {
    const el = document.getElementById(id);
    el.textContent = text || '-';
    el.classList.toggle('empty', !text);
  }

  function renderConfirmSummary() {
    setCf('cfName', document.getElementById('name').value.trim());

    const cat = ['재직자', '직업계고', '대학생', '일반시민'].find(
      c => document.getElementById(`catBtn-${c}`).classList.contains('active')
    ) || '';
    let affil = '';
    if (cat === '재직자') {
      const company = document.getElementById('company').value.trim();
      affil = company ? `재직자 · ${company}` : '재직자 (회사명 입력 필요)';
    } else if (isFutureTalent(cat)) {
      const school = document.getElementById('school').value.trim();
      affil = school ? `${cat} · ${school}` : `${cat} (학교명 입력 필요)`;
    } else if (cat === '일반시민') {
      affil = '일반 시민';
    }
    setCf('cfAffil', affil);

    const slotValEl = document.getElementById('slotVal');
    setCf('cfSlot', slotValEl.classList.contains('empty') ? '' : slotValEl.textContent);
  }

  function handleLiveStroke(msg) {
    if (msg.phase === 'clear') {
      clearLiveCanvas();
      liveIndicator.style.display = 'none';
      remoteBadge.style.display = 'none';
      placeholder.style.display = 'block';
    } else if (msg.phase === 'done') {
      liveIndicator.style.display = 'none';
    } else {
      placeholder.style.display = 'none';
      remoteBadge.style.display = 'none';
      liveIndicator.style.display = 'flex';
      drawLiveStrokes(msg.points || []);
    }
  }

  function applyRemoteState(data) {
    suppressEcho = true;

    const nameEl = document.getElementById('name');
    const companyEl = document.getElementById('company');
    const schoolEl = document.getElementById('school');

    if (document.activeElement !== nameEl) nameEl.value = data.성명 || '';
    if (document.activeElement !== companyEl) companyEl.value = data.회사명 || '';
    if (document.activeElement !== schoolEl) schoolEl.value = data.학교명 || '';

    ['재직자', '직업계고', '대학생', '일반시민'].forEach(c => {
      const matches = data.재직자여부 === '일반시민' ? c === '일반시민'
        : data.재직자여부 === '재직자' ? c === '재직자'
        : isFutureTalent(c) && subCatLocal === c;
      document.getElementById(`catBtn-${c}`).classList.toggle('active', matches);
    });
    document.getElementById('companyField').classList.toggle('show', data.재직자여부 === '재직자');
    document.getElementById('schoolField').classList.toggle('show', data.재직자여부 === '미래인재');

    const slotValEl = document.getElementById('slotVal');
    if (data.시간대) {
      slotValEl.textContent = `${data.시간대} 시간대`;
      slotValEl.classList.remove('empty');
    } else {
      slotValEl.textContent = '아직 키오스크에서 선택 전이에요';
      slotValEl.classList.add('empty');
    }

    if (data.signature) {
      lastRemoteSignature = data.signature;
      remoteImg.src = data.signature;
      remoteBadge.style.display = 'flex';
      placeholder.style.display = 'none';
      liveIndicator.style.display = 'none';
      drawSignatureImageOnLiveCanvas(data.signature);
    } else {
      lastRemoteSignature = '';
      remoteBadge.style.display = 'none';
      clearLiveCanvas();
      placeholder.style.display = 'block';
    }

    suppressEcho = false;
    renderConfirmSummary();
  }

  function bindField(id, field) {
    const el = document.getElementById(id);
    let timer;
    el.addEventListener('input', () => {
      renderConfirmSummary();
      if (suppressEcho) return;
      clearTimeout(timer);
      timer = setTimeout(() => send({ type: 'update', field, value: el.value }), 250);
    });
  }
  bindField('name', '성명');
  bindField('company', '회사명');
  bindField('school', '학교명');

  document.getElementById('name').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    document.getElementById('company').focus();
  });

  function onSubmitted(result) {
    const submittedName = document.getElementById('name').value.trim();
    const namePrefix = submittedName ? `${submittedName}님 ` : '';
    showStatus(`${namePrefix}등록 완료! (${result.sheetNumber}번째 시트, ${result.rowNumberInSheet}번째 줄) 🚌`, 'ok');
    document.getElementById('name').value = '';
    document.getElementById('company').value = '';
    document.getElementById('school').value = '';
    document.getElementById('companyField').classList.remove('show');
    document.getElementById('schoolField').classList.remove('show');
    ['재직자', '직업계고', '대학생', '일반시민'].forEach(c => document.getElementById(`catBtn-${c}`).classList.remove('active'));
    subCatLocal = '';
    lastRemoteSignature = '';
    clearLiveCanvas();
    placeholder.style.display = 'block';
    remoteBadge.style.display = 'none';
    renderConfirmSummary();
    document.getElementById('name').focus();
  }

  function showStatus(text, cls) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status' + (cls ? ' ' + cls : '');
  }
</script>

</body>
</html>
