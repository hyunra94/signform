<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 - 견학 방명록</title>
<link rel="icon" href="https://hyunra94.github.io/assets/favicon.png">
<meta property="og:image" content="https://hyunra94.github.io/assets/og-default.png">
<meta property="og:url" content="https://hyunra94.github.io/[레포명]/">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #FFF0F5; --bg-2: #FFE4E1;
    --accent: #F7B8C4; --accent-dark: #E88FA2;
    --lavender: #E6E0F8; --text: #5A4A50; --white: #FFFFFF;
    --shadow: rgba(232, 143, 162, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    margin: 0; padding: 24px 16px; color: var(--text); min-height: 100vh;
  }
  .card {
    max-width: 640px; margin: 0 auto; background: var(--white);
    border-radius: 20px; box-shadow: 0 8px 24px var(--shadow); padding: 28px 24px;
  }
  h1 { font-size: 19px; font-weight: 700; text-align: center; margin: 0 0 4px; color: var(--accent-dark); }
  .subtitle { text-align: center; font-size: 12.5px; color: #a98a92; margin-bottom: 22px; }

  .key-row { display: flex; gap: 8px; }
  .key-row input {
    flex: 1; min-width: 0; padding: 12px 14px; border: 1.5px solid var(--lavender); border-radius: 12px;
    font-family: inherit; font-size: 14px; background: #FDFBFF; outline: none;
  }
  .key-row input:focus { border-color: var(--accent); }
  .key-row button {
    padding: 12px 18px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: white; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }

  .status { text-align: center; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .status.err { color: #D97070; }

  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--lavender); }
  th { color: var(--accent-dark); font-weight: 700; background: #FDF3F6; }
  td.date { font-weight: 700; }
  td a {
    display: inline-block; margin: 0 3px; padding: 5px 10px; border-radius: 8px;
    background: #FDF3F6; color: var(--accent-dark); text-decoration: none; font-size: 12px; font-weight: 500;
  }
  td a:hover { background: var(--accent); color: white; }

  .empty { text-align: center; color: #c9a8b0; font-size: 13px; padding: 30px 0; }
  .hidden { display: none !important; }
  .remember-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: #a98a92; }

  .btn-danger {
    background: #FDEDED !important; color: #D97070 !important;
  }
  .btn-danger:hover { background: #D97070 !important; color: white !important; }
  .btn-plain {
    background: none; border: none; color: var(--accent-dark); font-size: 12px;
    cursor: pointer; text-decoration: underline; padding: 0;
  }
  .btn-plain:disabled { opacity: 0.4; cursor: not-allowed; }

  .detail-loading { text-align: center; font-size: 12px; color: #c9a8b0; padding: 10px 0; }

  /* ---- 상세보기 팝업 ---- */
  .detail-modal-backdrop {
    position: fixed; inset: 0; background: rgba(90, 74, 80, 0.5);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 30;
  }
  .detail-modal-backdrop.open { display: flex; }
  .detail-modal-card {
    background: var(--white); border-radius: 20px; padding: 22px 20px; width: 100%; max-width: 560px;
    max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }
  .detail-modal-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .detail-modal-head h3 { font-size: 15px; color: var(--accent-dark); margin: 0; }
  .detail-modal-actions { display: flex; align-items: center; gap: 12px; }
  .detail-modal-close {
    background: none; border: none; font-size: 20px; color: var(--text); cursor: pointer; line-height: 1;
  }
  .detail-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 18px; table-layout: fixed; }
  .detail-table th, .detail-table td {
    padding: 7px 6px; text-align: center; border-bottom: 1px solid #FDF3F6;
    word-break: break-word; overflow-wrap: anywhere; /* 성명/소속이 길어도 칸을 벗어나지 않고 줄바꿈되게 함 */
  }
  .detail-table th { color: #a98a92; font-weight: 500; }
  .detail-table th:nth-child(1), .detail-table td:nth-child(1) { width: 26px; }
  .detail-table th:nth-child(2), .detail-table td:nth-child(2) { width: 19%; }
  .detail-table th:nth-child(3), .detail-table td:nth-child(3) { width: 23%; }
  .detail-table th:nth-child(4), .detail-table td:nth-child(4) { width: 18%; }
  .detail-table th:nth-child(5), .detail-table td:nth-child(5) { width: 10%; }
  .detail-table th:nth-child(6), .detail-table td:nth-child(6) { width: 10%; }
  .detail-table th:nth-child(7), .detail-table td:nth-child(7) { width: 14%; }
  .detail-section-title { font-size: 13px; font-weight: 700; color: var(--accent-dark); margin: 14px 0 6px; }
  .detail-section-title:first-child { margin-top: 0; }
  .lazy-thumb { font-size: 11px; color: #b7a3ab; }
  .edit-input {
    width: 100%; padding: 4px 6px; border-radius: 6px; border: 1.5px solid var(--accent);
    font-family: inherit; font-size: 12px; box-sizing: border-box;
  }
  .edit-row-btn { color: var(--accent-dark); }
  .add-row-form {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;
    padding: 12px; border: 1.5px dashed var(--accent); border-radius: 12px; background: #FFFBFC;
  }
  .add-row-form label { font-size: 11px; color: #a98a92; display: block; margin-bottom: 2px; }
  .add-row-form input[type="text"], .add-row-form select {
    width: 100%; padding: 7px 8px; border-radius: 8px; border: 1.5px solid var(--lavender);
    font-family: inherit; font-size: 13px; box-sizing: border-box; background: var(--white);
  }
  .add-row-form .full { grid-column: 1 / -1; }
  .add-row-actions { grid-column: 1 / -1; display: flex; gap: 14px; justify-content: flex-end; }
  /* 전체삭제는 실수로 누르기 쉬워서 기본적으로 숨겨두고, "관리" 표머리를 더블클릭해야만 나타남 */
  .danger-action { display: none; }
  #listTable.show-danger .danger-action { display: inline-block; }

  .home-fab {
    position: fixed; top: 12px; left: 12px; z-index: 5;
    width: 38px; height: 38px; border-radius: 50%;
    background: white; box-shadow: 0 4px 12px rgba(232,143,162,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; text-decoration: none; color: inherit; border: none; cursor: pointer;
  }
  .home-fab:active { transform: scale(0.94); }
</style>
</head>
<body>
<a href="./index.html" class="home-fab" title="메인으로">🏠</a>

<div class="card">
  <h1>🔐 관리자 - 견학 방명록</h1>
  <p class="subtitle">날짜별 제출 현황을 확인하고 PDF/CSV를 받을 수 있어요</p>

  <div id="loginArea">
    <div class="key-row">
      <input type="password" id="adminKey" placeholder="관리자 키 입력">
      <button onclick="loadList()">확인</button>
    </div>
    <div class="remember-row">
      <input type="checkbox" id="rememberKey" style="width:14px;height:14px;">
      <label for="rememberKey">이 브라우저에 기억하기</label>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div id="listArea" class="hidden">
    <table id="listTable">
      <thead>
        <tr><th>날짜</th><th>제출 인원</th><th>동의 인원</th><th>최근 제출</th><th>다운로드</th><th id="manageHeader" ondblclick="toggleDeleteAllVisible()" title="더블클릭하면 전체삭제 버튼이 나타나요/숨겨져요" style="cursor:pointer; user-select:none;">관리</th></tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
    <div class="empty hidden" id="emptyMsg">아직 제출된 기록이 없어요.</div>
  </div>
</div>

<!-- 상세보기 팝업 -->
<div class="detail-modal-backdrop" id="detailModalBackdrop">
  <div class="detail-modal-card">
    <div class="detail-modal-head">
      <h3 id="detailModalTitle">참석자 명단</h3>
      <div class="detail-modal-actions">
        <button class="btn-plain" onclick="toggleAddRowForm()">＋ 참석자 추가</button>
        <button class="btn-plain" id="detailRefreshBtn" onclick="refreshOpenDetail()">🔄 새로고침</button>
        <button class="detail-modal-close" onclick="closeDetailModal()">✕</button>
      </div>
    </div>
    <div id="addRowFormWrap" class="add-row-form hidden">
      <div class="full" style="font-size:11.5px;color:#a98a92;margin:-2px 0 2px;">누락된 참석자를 직접 등록해요. 실제 서명은 없이 텍스트로만 기록되고, PDF의 서명 칸은 비어있어요.</div>
      <div>
        <label for="addName">성명</label>
        <input type="text" id="addName" placeholder="성명">
      </div>
      <div>
        <label for="addContact">연락처</label>
        <input type="text" id="addContact" placeholder="연락처 (선택)">
      </div>
      <div>
        <label for="addCategory">구분</label>
        <select id="addCategory" onchange="updateAddSosoLabel()">
          <option value="일반시민">일반시민</option>
          <option value="재직자">재직자</option>
          <option value="미래인재">미래인재</option>
        </select>
      </div>
      <div id="addSosoRow" class="hidden">
        <label for="addSoso">소속</label>
        <input type="text" id="addSoso" placeholder="회사명/학교명">
      </div>
      <div class="full" style="display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="addAgree" style="width:14px;height:14px;">
        <label for="addAgree" style="font-size:12.5px;color:var(--text);margin:0;">개인정보 수집 동의</label>
      </div>
      <div class="add-row-actions">
        <button class="btn-plain" onclick="toggleAddRowForm()">취소</button>
        <button class="btn-plain" id="addRowSaveBtn" onclick="submitAddRow()">저장</button>
      </div>
    </div>
    <div id="detailModalBody"><div class="detail-loading">불러오는 중...</div></div>
  </div>
</div>

<!-- 🚨 임시: 나눠서 만든 PDF 파일 목록 팝업 -->
<div class="detail-modal-backdrop" id="partsModalBackdrop">
  <div class="detail-modal-card">
    <div class="detail-modal-head">
      <h3 id="partsModalTitle">나눠서 만들기</h3>
      <div class="detail-modal-actions">
        <button class="detail-modal-close" onclick="closePartsModal()">✕</button>
      </div>
    </div>
    <div id="partsModalBody"><div class="detail-loading">만들고 있어요...</div></div>
  </div>
</div>

<script>
  // ⚠️ 배포된 Worker 주소로 교체하세요
  const WORKER_HTTP_URL = 'https://signform.hyunra94.workers.dev';

  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('admin_key');
    if (saved) {
      document.getElementById('adminKey').value = saved;
      document.getElementById('rememberKey').checked = true;
      loadList();
    }
  });

  async function loadList() {
    const key = document.getElementById('adminKey').value.trim();
    const statusEl = document.getElementById('status');
    if (!key) {
      statusEl.textContent = '관리자 키를 입력해주세요.';
      statusEl.className = 'status err';
      return;
    }

    statusEl.textContent = '불러오는 중...';
    statusEl.className = 'status';

    try {
      const res = await fetch(`${WORKER_HTTP_URL}/admin/list?key=${encodeURIComponent(key)}`);
      if (res.status === 401) {
        statusEl.textContent = '관리자 키가 올바르지 않습니다.';
        statusEl.className = 'status err';
        return;
      }
      if (!res.ok) throw new Error('불러오기 실패');

      const data = await res.json();
      renderList(data.items, key);

      if (document.getElementById('rememberKey').checked) {
        localStorage.setItem('admin_key', key);
      } else {
        localStorage.removeItem('admin_key');
      }

      document.getElementById('loginArea').classList.add('hidden');
      document.getElementById('listArea').classList.remove('hidden');
    } catch (err) {
      statusEl.textContent = '오류가 발생했습니다: ' + err.message;
      statusEl.className = 'status err';
    }
  }

  let currentAdminKey = '';

  function renderList(items, key) {
    currentAdminKey = key;
    const tbody = document.getElementById('listBody');
    const emptyMsg = document.getElementById('emptyMsg');
    const table = document.getElementById('listTable');
    tbody.innerHTML = '';

    if (!items || items.length === 0) {
      table.classList.add('hidden');
      emptyMsg.classList.remove('hidden');
      return;
    }
    table.classList.remove('hidden');
    emptyMsg.classList.add('hidden');

    items.forEach(item => {
      const tr = document.createElement('tr');
      const lastTime = item.lastSubmittedAt
        ? new Date(item.lastSubmittedAt).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        : '-';
      const pdfUrl = `${WORKER_HTTP_URL}/download?programId=${encodeURIComponent(item.programId)}&key=${encodeURIComponent(key)}`;
      const csvUrl = `${WORKER_HTTP_URL}/export?programId=${encodeURIComponent(item.programId)}&key=${encodeURIComponent(key)}`;
      const safeId = item.programId.replace(/[^a-zA-Z0-9]/g, '_');

      const isVr = item.programId.endsWith('-vr');
      const dateLabel = isVr ? item.programId.slice(0, -3) : item.programId;
      const typeBadge = isVr
        ? '<span style="display:inline-block;margin-left:6px;font-size:10px;background:#E88FA2;color:white;border-radius:8px;padding:1px 6px;">VR버스</span>'
        : '<span style="display:inline-block;margin-left:6px;font-size:10px;background:#FDF3F6;color:#E88FA2;border-radius:8px;padding:1px 6px;">서명록</span>';

      tr.innerHTML = `
        <td class="date">${dateLabel}${typeBadge}</td>
        <td>${item.totalCount}명</td>
        <td>${item.agreedCount}명</td>
        <td>${lastTime}</td>
        <td>
          <a href="${pdfUrl}" target="_blank">PDF</a>
          <a href="${csvUrl}" target="_blank">CSV</a>
        </td>
        <td>
          <button class="btn-plain" onclick="openDetailModal('${item.programId}', '${safeId}')">상세보기</button><br>
          <button class="btn-plain" style="margin-top:4px;" onclick="rebuildPdf('${item.programId}')">PDF 다시그리기</button><br>
          <button class="btn-plain" style="margin-top:4px;" onclick="compressImages('${item.programId}')">🗜️ 이미지 압축</button><br>
          <button class="btn-plain" style="margin-top:4px;" onclick="rebuildPdfPartsByCategory('${item.programId}')">🚨 구분별로 나눠서(임시)</button><br>
          <button class="btn-plain danger-action" style="color:#D97070;margin-top:4px;" onclick="deleteDay('${item.programId}')">전체삭제</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  let openDetailProgramId = null;
  let openDetailSafeId = null;

  function openDetailModal(programId, safeId) {
    openDetailProgramId = programId;
    openDetailSafeId = safeId;
    document.getElementById('detailModalTitle').textContent = `참석자 명단 · ${programId}`;
    document.getElementById('addRowFormWrap').classList.add('hidden');
    document.getElementById('detailModalBackdrop').classList.add('open');
    loadDetail(programId, safeId);
  }

  function closeDetailModal() {
    document.getElementById('detailModalBackdrop').classList.remove('open');
    document.getElementById('addRowFormWrap').classList.add('hidden');
    openDetailProgramId = null;
    openDetailSafeId = null;
  }

  // ---------- 누락된 참석자를 관리자가 직접 추가 (서명/손글씨 없이 텍스트만) ----------
  function toggleAddRowForm() {
    const el = document.getElementById('addRowFormWrap');
    const willShow = el.classList.contains('hidden');
    el.classList.toggle('hidden');
    if (willShow) {
      document.getElementById('addName').value = '';
      document.getElementById('addContact').value = '';
      document.getElementById('addCategory').value = '일반시민';
      document.getElementById('addSoso').value = '';
      document.getElementById('addAgree').checked = false;
      updateAddSosoLabel();
      document.getElementById('addName').focus();
    }
  }

  function updateAddSosoLabel() {
    const category = document.getElementById('addCategory').value;
    const sosoRow = document.getElementById('addSosoRow');
    const sosoInput = document.getElementById('addSoso');
    if (category === '일반시민') {
      sosoRow.classList.add('hidden');
    } else {
      sosoRow.classList.remove('hidden');
      sosoInput.placeholder = category === '재직자' ? '회사명' : '학교명';
    }
  }

  async function submitAddRow() {
    if (!lastDetailProgramId) return;
    const 성명 = document.getElementById('addName').value.trim();
    if (!성명) { alert('성명을 입력해주세요.'); return; }
    const 재직자여부 = document.getElementById('addCategory').value === '일반시민' ? '' : document.getElementById('addCategory').value;
    const soso = document.getElementById('addSoso').value.trim();
    // 그날 이미 등록된 다른 참석자가 있으면 그 사람의 장소를 그대로 재사용(지난 날짜 보정 시에도 정확하도록)
    const existingRow = Object.values(lastDetailItemsByKey)[0];
    const body = {
      성명,
      연락처: document.getElementById('addContact').value.trim(),
      재직자여부,
      회사명: 재직자여부 === '재직자' ? soso : '',
      학교명: 재직자여부 === '미래인재' ? soso : '',
      동의: document.getElementById('addAgree').checked,
      장소: (existingRow && existingRow.장소) || '',
    };

    const btn = document.getElementById('addRowSaveBtn');
    btn.disabled = true;
    try {
      const res = await fetch(`${WORKER_HTTP_URL}/admin/add-row?programId=${encodeURIComponent(lastDetailProgramId)}&key=${encodeURIComponent(currentAdminKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '추가 실패');
      document.getElementById('addRowFormWrap').classList.add('hidden');
      await loadDetail(lastDetailProgramId, lastDetailSafeId);
      await loadList();
    } catch (err) {
      alert('추가 중 오류: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  }

  function refreshOpenDetail() {
    if (openDetailProgramId) loadDetail(openDetailProgramId, openDetailSafeId);
  }

  async function loadDetail(programId, safeId) {
    const body = document.getElementById('detailModalBody');
    body.innerHTML = '<div class="detail-loading">불러오는 중...</div>';
    try {
      const res = await fetch(`${WORKER_HTTP_URL}/admin/rows?programId=${encodeURIComponent(programId)}&key=${encodeURIComponent(currentAdminKey)}`);
      if (!res.ok) throw new Error('불러오기 실패');
      const data = await res.json();
      renderDetail(body, programId, safeId, data.items);
    } catch (err) {
      body.innerHTML = `<div class="detail-loading">오류: ${err.message}</div>`;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // 실제 PDF와 같은 순서(재직자 → 미래인재 → 일반시민)로 구분해서 보여줌 — PDF를 직접 만들지 않고도
  // 실시간으로 PDF와 거의 같은 형태의 목록을 확인할 수 있게 하기 위함
  const DETAIL_CATEGORY_ORDER = ['재직자', '미래인재', '일반시민'];
  function detailCategoryOf(it) {
    if (it.재직자여부 === '재직자') return '재직자';
    if (it.재직자여부 === '미래인재') return '미래인재';
    return '일반시민';
  }

  // rowKey -> 그 사람의 항목 전체. 삭제 확인 문구·수정 폼에 쓸 값을 여기서 조회해서 씀
  // (사용자 입력값을 onclick 속성에 직접 넣지 않고 조회해서 씀 — XSS 방지)
  let lastDetailItemsByKey = {};
  let lastDetailProgramId = null;
  let lastDetailSafeId = null;

  function renderDetail(body, programId, safeId, items) {
    lastDetailProgramId = programId;
    lastDetailSafeId = safeId;
    if (!items || items.length === 0) {
      body.innerHTML = '<div class="detail-loading">참석자가 없어요.</div>';
      return;
    }
    lastDetailItemsByKey = {};
    items.forEach((it) => { lastDetailItemsByKey[it.rowKey] = it; });

    const groups = {};
    items.forEach((it) => {
      const cat = detailCategoryOf(it);
      (groups[cat] = groups[cat] || []).push(it);
    });

    const lazyThumb = (rowKey, field) =>
      `<span class="lazy-thumb" data-rowkey="${rowKey}" data-field="${field}">불러오는 중…</span>`;

    const sectionsHtml = DETAIL_CATEGORY_ORDER.filter((cat) => groups[cat] && groups[cat].length).map((cat) => {
      const rowsHtml = groups[cat].map((it, i) => {
        const nameText = it.성명 || '';
        const sosoText = it.회사명 || it.학교명 || ''; // 카테고리에 맞는 쪽만 이미 채워져 있음
        const actionBtns = `
          <button class="btn-plain edit-row-btn" onclick="startEditRow('${it.rowKey}')">수정</button>
          <button class="btn-plain del-row-btn" style="color:#D97070;" onclick="deleteRow('${programId}', '${it.rowKey}', '${safeId}')">삭제</button>
        `;

        // 이름+소속을 한 캔버스에 손글씨로 같이 받은 경우(VR버스 셀프 키오스크): 텍스트가 둘 다 없으면
        // 같은 이미지를 두 번 따로 불러올 필요 없이 한 칸에 합쳐서 보여줌
        if (!nameText && !sosoText && it.has필기이미지) {
          return `
            <tr data-rowkey="${it.rowKey}">
              <td>${i + 1}</td>
              <td colspan="2">${lazyThumb(it.rowKey, '필기이미지')}</td>
              <td>${escapeHtml(it.연락처 || '')}</td>
              <td>${it.동의 ? 'O' : 'X'}</td>
              <td>${it.hasSignature ? '✓' : '-'}</td>
              <td>${actionBtns}</td>
            </tr>
          `;
        }

        const nameCell = nameText ? escapeHtml(nameText) : (it.has필기이미지 ? lazyThumb(it.rowKey, '필기이미지') : '-');
        const sosoCell = sosoText ? escapeHtml(sosoText) : (it.has소속이미지 ? lazyThumb(it.rowKey, '소속이미지') : '-');

        return `
          <tr data-rowkey="${it.rowKey}">
            <td>${i + 1}</td>
            <td>${nameCell}</td>
            <td>${sosoCell}</td>
            <td>${escapeHtml(it.연락처 || '')}</td>
            <td>${it.동의 ? 'O' : 'X'}</td>
            <td>${it.hasSignature ? '✓' : '-'}</td>
            <td>${actionBtns}</td>
          </tr>
        `;
      }).join('');

      return `
        <div class="detail-section-title">${cat} (${groups[cat].length}명)</div>
        <table class="detail-table">
          <thead><tr><th>#</th><th>성명</th><th>소속</th><th>연락처</th><th>동의</th><th>서명</th><th></th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      `;
    }).join('');

    body.innerHTML = sectionsHtml;
    loadLazyThumbs(programId);
  }

  // 텍스트가 없어서 썸네일이 필요한 항목만, 한 명씩(최대 3개씩 동시) 그 이미지 하나만 불러옴
  async function loadLazyThumbs(programId) {
    const els = Array.from(document.querySelectorAll('.lazy-thumb'));
    if (els.length === 0) return;
    let idx = 0;
    async function worker() {
      while (idx < els.length) {
        const el = els[idx++];
        const rowKey = el.dataset.rowkey;
        const field = el.dataset.field;
        try {
          const res = await fetch(`${WORKER_HTTP_URL}/admin/row-image?programId=${encodeURIComponent(programId)}&rowKey=${encodeURIComponent(rowKey)}&field=${encodeURIComponent(field)}&key=${encodeURIComponent(currentAdminKey)}`);
          const data = await res.json();
          if (data && data.dataUrl) {
            el.outerHTML = `<img src="${data.dataUrl}" style="max-height:28px;max-width:100px;vertical-align:middle;" alt="손글씨">`;
          } else {
            el.textContent = '(없음)';
          }
        } catch (err) {
          el.textContent = '(불러오기 실패)';
        }
      }
    }
    await Promise.all([worker(), worker(), worker()]);
  }

  async function deleteRow(programId, rowKey, safeId) {
    const name = (lastDetailItemsByKey[rowKey] || {}).성명 || '';
    if (!confirm(`${name || '이'} 참석자를 삭제할까요? 되돌릴 수 없어요.`)) return;
    // 목록이 갱신되기 전까지 다른 삭제 버튼도 눌러서 엉뚱한 사람이 지워지는 일이 없게 잠깐 잠금
    // (지금은 rowKey로 정확한 대상을 지정해서 실제로 밀림 문제는 안 생기지만, 이중 클릭 방지 차원에서도 유지)
    document.querySelectorAll('.del-row-btn').forEach((btn) => (btn.disabled = true));
    try {
      const res = await fetch(`${WORKER_HTTP_URL}/admin/delete-row?programId=${encodeURIComponent(programId)}&rowKey=${encodeURIComponent(rowKey)}&key=${encodeURIComponent(currentAdminKey)}`, { method: 'DELETE' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '삭제 실패');
      await loadDetail(programId, safeId);
      await loadList(); // 목록의 인원수도 갱신
    } catch (err) {
      alert('삭제 중 오류: ' + err.message);
      document.querySelectorAll('.del-row-btn').forEach((btn) => (btn.disabled = false));
    }
  }

  function toggleDeleteAllVisible() {
    document.getElementById('listTable').classList.toggle('show-danger');
  }

  // ---------- 잘못 입력된 텍스트 수정 (손글씨/서명 이미지는 대상 아님 — 지우고 다시 받아야 함) ----------
  function startEditRow(rowKey) {
    const it = lastDetailItemsByKey[rowKey];
    const tr = document.querySelector(`tr[data-rowkey="${rowKey}"]`);
    if (!it || !tr) return;

    const idx = tr.children[0].textContent;
    const nameText = it.성명 || '';
    const sosoText = it.회사명 || it.학교명 || '';
    const isCombinedImage = !nameText && !sosoText && it.has필기이미지;
    const sosoPlaceholder = !sosoText && it.has소속이미지 ? '(손글씨로 입력됨 — 여기 입력하면 텍스트로 바뀌어요)' : '';

    const nameCell = isCombinedImage
      ? `<td colspan="2" style="color:#b7a3ab;font-size:11.5px;">이름+소속이 손글씨 이미지라 여기서는 수정할 수 없어요. 삭제 후 다시 받아주세요.</td>`
      : `
        <td><input type="text" class="edit-input" id="editName-${rowKey}" value="${escapeHtml(nameText)}" placeholder="성명"></td>
        <td><input type="text" class="edit-input" id="editSoso-${rowKey}" value="${escapeHtml(sosoText)}" placeholder="${sosoPlaceholder}"></td>
      `;

    tr.innerHTML = `
      <td>${idx}</td>
      ${nameCell}
      <td><input type="text" class="edit-input" id="editContact-${rowKey}" value="${escapeHtml(it.연락처 || '')}" placeholder="연락처"></td>
      <td><input type="checkbox" id="editAgree-${rowKey}" ${it.동의 ? 'checked' : ''}></td>
      <td>${it.hasSignature ? '✓' : '-'}</td>
      <td>
        <button class="btn-plain" onclick="saveEditRow('${rowKey}')">저장</button>
        <button class="btn-plain" onclick="loadDetail(lastDetailProgramId, lastDetailSafeId)">취소</button>
      </td>
    `;
  }

  async function saveEditRow(rowKey) {
    const it = lastDetailItemsByKey[rowKey] || {};
    const patch = { 동의: document.getElementById(`editAgree-${rowKey}`).checked };
    const contactEl = document.getElementById(`editContact-${rowKey}`);
    if (contactEl) patch.연락처 = contactEl.value.trim();

    const nameEl = document.getElementById(`editName-${rowKey}`);
    const sosoEl = document.getElementById(`editSoso-${rowKey}`);
    if (nameEl) patch.성명 = nameEl.value.trim();
    if (sosoEl) {
      const soso = sosoEl.value.trim();
      if (it.재직자여부 === '재직자') patch.회사명 = soso;
      else if (it.재직자여부 === '미래인재') patch.학교명 = soso;
    }

    try {
      const res = await fetch(`${WORKER_HTTP_URL}/admin/edit-row?programId=${encodeURIComponent(lastDetailProgramId)}&rowKey=${encodeURIComponent(rowKey)}&key=${encodeURIComponent(currentAdminKey)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '수정 실패');
      await loadDetail(lastDetailProgramId, lastDetailSafeId);
      await loadList();
    } catch (err) {
      alert('수정 중 오류: ' + err.message);
    }
  }

  async function deleteDay(programId) {
    if (!confirm(`${programId} 방명록 전체를 삭제할까요?\n참석자 전원의 서명/데이터가 모두 사라지고 되돌릴 수 없어요.`)) return;
    try {
      const res = await fetch(`${WORKER_HTTP_URL}/admin/delete-day?programId=${encodeURIComponent(programId)}&key=${encodeURIComponent(currentAdminKey)}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('삭제 실패');
      await loadList();
    } catch (err) {
      alert('삭제 중 오류: ' + err.message);
    }
  }

  let rebuildPollToken = 0; // 모달을 새로 열 때마다 값을 바꿔서, 이전 폴링 루프가 계속 돌고 있어도 화면을 덮어쓰지 않게 함

  async function rebuildPdf(programId) {
    const newPlace = prompt('PDF를 최신 서식으로 다시 그려요.\n장소가 잘못 들어갔다면 새 장소명을 입력하세요 (전체 정정됨). 그대로 두려면 빈 칸으로 확인.', '');
    if (newPlace === null) return; // 취소
    const place = newPlace.trim();
    try {
      const res = await fetch(`${WORKER_HTTP_URL}/admin/rebuild?programId=${encodeURIComponent(programId)}&key=${encodeURIComponent(currentAdminKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 장소: place }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '다시 그리기 실패');
      showRebuildProgressModal(programId, place);
    } catch (err) {
      alert('오류: ' + err.message);
    }
  }

  const REBUILD_STALL_MS = 20000; // 진행 상황이 이만큼 그대로 멈춰있으면 사실상 죽은 것으로 보고 포기함
                                    // (실행시간 제한에 걸려 죽으면 진행률 갱신 자체가 더는 안 일어남)

  // PDF가 몇 명 중 몇 명까지 그려졌는지 실시간으로 보여줌 — "요청은 접수됐는데 실제로 끝났는지
  // 알 수 없다"는 문제를 해결하기 위함(뒤에서 조용히 실패해도 예전엔 알 방법이 없었음).
  // 인원이 많아서 통합 PDF가 멈추거나 계속 실패하면, 서버에서 미리 막지 않고 일단 시도는 해본 뒤
  // 화면 쪽에서 진행이 멈춘 걸 감지해서 자동으로 "구분별로 나눠서"로 대신 만들어줌.
  async function showRebuildProgressModal(programId, placeApplied) {
    const myToken = ++rebuildPollToken;
    const backdrop = document.getElementById('partsModalBackdrop');
    const body = document.getElementById('partsModalBody');
    document.getElementById('partsModalTitle').textContent = `${programId} — PDF 다시 그리는 중`;
    body.innerHTML = `<div class="detail-loading">준비하는 중...</div>`;
    backdrop.classList.add('open');

    const placeMsg = placeApplied ? `<p class="field-hint">장소가 "${escapeHtml(placeApplied)}"(으)로 정정됐어요.</p>` : '';

    let lastProgressKey = '';
    let lastProgressAt = Date.now();

    for (let i = 0; i < 80; i++) { // 1.2초 x 80 = 최대 약 96초까지 지켜봄 (그 전에 멈춤 감지되면 먼저 끝남)
      await new Promise((r) => setTimeout(r, 1200));
      if (myToken !== rebuildPollToken) return; // 그 사이 다른 다시그리기가 새로 시작됐으면 여기서 멈춤

      let s;
      try {
        const res = await fetch(`${WORKER_HTTP_URL}/admin/rebuild-status?programId=${encodeURIComponent(programId)}&key=${encodeURIComponent(currentAdminKey)}`);
        const data = await res.json();
        s = data && data.status;
      } catch (err) { continue; }
      if (!s) continue;

      if (s.status === 'running') {
        const progressKey = `${s.done || 0}/${s.page || 0}`;
        if (progressKey !== lastProgressKey) {
          lastProgressKey = progressKey;
          lastProgressAt = Date.now();
        }

        const pct = s.total ? Math.round(((s.done || 0) / s.total) * 100) : 0;
        const largeNote = s.large ? `<p class="field-hint">인원이 많아서 시간이 좀 걸릴 수 있어요. 너무 오래 걸리면 자동으로 구분별로 나눠서 대신 만들어요.</p>` : '';
        body.innerHTML = `
          <div style="text-align:center;">
            <div style="font-size:14px;margin-bottom:10px;">${s.done || 0} / ${s.total}명 그리는 중${s.totalPages ? ` (페이지 ${s.page || 0}/${s.totalPages})` : ''}</div>
            <div style="background:#FDF3F6;border-radius:8px;overflow:hidden;height:10px;">
              <div style="background:var(--accent-dark);height:100%;width:${pct}%;transition:width 0.3s;"></div>
            </div>
          </div>
          ${largeNote}
        `;

        if (Date.now() - lastProgressAt > REBUILD_STALL_MS) {
          body.innerHTML += `<p class="field-hint" style="margin-top:10px;">${REBUILD_STALL_MS / 1000}초 넘게 진행이 안 돼서, 대신 구분별로 나눠서 만들게요...</p>`;
          await fallbackToPartsByCategory(programId, myToken);
          return;
        }
      } else if (s.status === 'success') {
        body.innerHTML = `<div class="detail-loading">✅ ${s.total}명 전체 완료!</div>${placeMsg}`;
        return;
      } else if (s.status === 'error') {
        if (s.willRetry) {
          body.innerHTML = `<div class="detail-loading">⚠️ 한 번 실패해서 자동으로 다시 시도하고 있어요...</div>`;
          lastProgressKey = ''; lastProgressAt = Date.now(); // 새로 재시도하는 거라 멈춤 판단 기준 시각도 리셋
          continue;
        }
        body.innerHTML = `<div class="detail-loading">⚠️ 통합 PDF가 계속 실패해서, 대신 구분별로 나눠서 만들게요...</div>`;
        await fallbackToPartsByCategory(programId, myToken);
        return;
      }
    }
    body.innerHTML = `<div class="detail-loading">시간이 너무 오래 걸려서, 대신 구분별로 나눠서 만들게요...</div>`;
    await fallbackToPartsByCategory(programId, myToken);
  }

  // 통합 PDF가 멈추거나 실패했을 때 자동으로 대신 시도하는 대체 수단
  async function fallbackToPartsByCategory(programId, myToken) {
    try {
      const res = await fetch(`${WORKER_HTTP_URL}/admin/rebuild-parts-by-category?programId=${encodeURIComponent(programId)}&maxPerFile=40&key=${encodeURIComponent(currentAdminKey)}`, { method: 'POST' });
      const data = await res.json();
      if (myToken !== rebuildPollToken) return; // 그 사이 다른 작업이 새로 시작됐으면 화면을 덮어쓰지 않음
      if (!res.ok) throw new Error(data.error || '구분별로 나눠서 만들기 실패');
      showPartsModalByCategory(programId, data.categoryCounts || {}, 40);
    } catch (err) {
      if (myToken !== rebuildPollToken) return;
      document.getElementById('partsModalBody').innerHTML = `<div class="detail-loading">❌ 대체 방법도 실패했어요: ${escapeHtml(err.message)}</div>`;
    }
  }

  // ---------- 🗜️ 이미지 압축: 이 기능 배포 이전에 저장된 서명/필기 이미지를 소급으로 축소(용량만 줄임, 화질 차이는 거의 없음) ----------
  async function compressImages(programId) {
    if (!confirm(`${programId}의 저장된 이미지 중 큰 것만 서버에서 축소해요.\n데이터/서명 내용은 그대로고, PDF 칸이 작아서 화질 차이는 거의 안 보여요.\n진행할까요?`)) return;
    try {
      const res = await fetch(`${WORKER_HTTP_URL}/admin/compress-images?programId=${encodeURIComponent(programId)}&key=${encodeURIComponent(currentAdminKey)}`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '이미지 압축 요청 실패');
      alert(`요청을 접수했어요. (${data.totalCount}명)\n뒤에서 처리되고 있어요 — 사람이 많으면 시간이 좀 걸려요.\n잠시 후 이 버튼을 다시 누르면 이번엔 진행 결과를 보여줘요.`);

      // 진행 결과 확인: 몇 초간 폴링해보고, 이미 끝나 있으면(방금 요청이 금방 끝난 경우 등) 바로 알려줌
      for (let i = 0; i < 5; i++) {
        await new Promise((r) => setTimeout(r, 2000));
        const st = await fetch(`${WORKER_HTTP_URL}/admin/compress-images-status?programId=${encodeURIComponent(programId)}&key=${encodeURIComponent(currentAdminKey)}`);
        const stData = await st.json();
        const result = stData && stData.result;
        if (result && Date.now() - result.at < 20000) {
          alert(`압축 완료: 전체 ${result.processedCount}명 중 ${result.compressedCount}명 이미지 축소함.`);
          return;
        }
      }
    } catch (err) {
      alert('오류: ' + err.message);
    }
  }

  function closePartsModal() {
    document.getElementById('partsModalBackdrop').classList.remove('open');
  }

  // ---------- 🚨 임시 비상 기능: 재직자/미래인재/일반시민 구분별로 각각 별도의 PDF로 생성 ----------
  async function rebuildPdfPartsByCategory(programId) {
    const sizeInput = prompt('한 구분 안에서 인원이 너무 많으면 몇 명씩 더 나눌까요? (기본 40명)', '40');
    if (sizeInput === null) return; // 취소
    const maxPerFile = Math.max(5, Math.min(150, parseInt(sizeInput, 10) || 40));
    try {
      const res = await fetch(`${WORKER_HTTP_URL}/admin/rebuild-parts-by-category?programId=${encodeURIComponent(programId)}&maxPerFile=${maxPerFile}&key=${encodeURIComponent(currentAdminKey)}`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '구분별로 나눠서 만들기 실패');

      showPartsModalByCategory(programId, data.categoryCounts || {}, maxPerFile);
    } catch (err) {
      alert('오류: ' + err.message);
    }
  }

  function showPartsModalByCategory(programId, categoryCounts, maxPerFile) {
    const backdrop = document.getElementById('partsModalBackdrop');
    const body = document.getElementById('partsModalBody');
    const categories = ['재직자', '미래인재', '일반시민'].filter((c) => categoryCounts[c] > 0);
    document.getElementById('partsModalTitle').textContent = `${programId} — 구분별로 나눠 만드는 중`;
    body.innerHTML = `<div class="detail-loading">만들고 있어요 — 잠시 후 아래에서 하나씩 눌러 다운로드하세요.</div>`;
    backdrop.classList.add('open');

    const links = categories.map((cat) => {
      const count = categoryCounts[cat];
      const subPartCount = Math.max(1, Math.ceil(count / maxPerFile));
      const rows = Array.from({ length: subPartCount }, (_, i) => i + 1).map((p) => {
        const url = `${WORKER_HTTP_URL}/download?programId=${encodeURIComponent(programId)}&cat=${encodeURIComponent(cat)}${subPartCount > 1 ? `&part=${p}` : ''}&key=${encodeURIComponent(currentAdminKey)}`;
        const label = subPartCount > 1 ? `${cat} ${p}/${subPartCount}` : cat;
        return `<div style="margin:6px 0;"><a href="${url}" target="_blank">📄 ${label}</a></div>`;
      }).join('');
      return `<div style="margin:12px 0;"><b>${cat}</b> (${count}명)${rows}</div>`;
    }).join('');

    const maxSubParts = Math.max(...categories.map((c) => Math.ceil(categoryCounts[c] / maxPerFile)), 1);
    setTimeout(() => {
      body.innerHTML = links + `<p class="field-hint" style="margin-top:10px;">혹시 링크가 아직 안 열리면(방금 생성 시작) 몇 초 더 기다렸다가 다시 눌러주세요.</p>`;
    }, Math.min(1000 + maxSubParts * 3 * 400, 8000));
  }
</script>

</body>
</html>
